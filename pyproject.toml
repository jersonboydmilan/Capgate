[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "capgate"
version = "0.1.0"
description = "Authority management for autonomous software agents: the agent proposes, the harness authorizes, the executor acts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "uvicorn>=0.30", "mcp>=1.9"]

[project.scripts]
capgate = "capgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capgate", "sdk/python/capgate_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q -m 'not docker'"
markers = ["docker: builds and attacks the isolated runtime (slow; run with -m docker)"]
pythonpath = ["src", "sdk/python", "tests"]
