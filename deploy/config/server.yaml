# Mounted read-only into the harness container only.
contracts: [contracts.yaml]
listen: {host: 0.0.0.0, port: 8080}
audit: /data/audit.jsonl
audit_echo: true                      # one line per audit record in `docker compose logs harness`
state: /data/state.db
signing_key_file: /secrets/signing_key
identity:
  keyring_file: /secrets/token_keyring
  max_ttl_seconds: 900
tools:
  web.search: {type: endpoint, url: "http://tools:9100/web.search", credential_file: /tool-credential/tool_credential}
  database.write: {type: endpoint, url: "http://tools:9100/database.write", credential_file: /tool-credential/tool_credential}
rate_limit:                           # per process; defaults shown
  client_rate: 20                     # requests/second per client address (checked before token verification)
  client_burst: 100
  principal_rate: 10                  # requests/second per agent or approver
  principal_burst: 60
  auth_failure_audit_per_minute: 20   # further failures are counted, not recorded individually
