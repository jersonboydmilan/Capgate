# Harness behind the SPIFFE-aware mTLS edge. It believes X-Client-Spiffe-Id /
# X-Client-Cert-Thumbprint only from the edge's network (trusted_proxies).
contracts: [contracts.yaml]
listen: {host: 0.0.0.0, port: 8080}
transport: uvicorn
trusted_proxies_env: CAPGATE_EDGE_SUBNET
audit: /data/audit.jsonl
audit_echo: true
state: /data/state.db
signing_key_file: /secrets/signing_key
identity:
  keyring_file: /secrets/token_keyring
  max_ttl_seconds: 900
mcp: false
tools:
  web.search: {type: endpoint, url: "http://tools:9100/web.search", credential_file: /tool-credential/tool_credential}
