# harness edge proxy
#
# Why it exists: uvicorn does not bound how slowly request headers arrive, and a
# mature proxy is the better place to normalise HTTP from untrusted clients.
# nginx terminates the agent's connection, enforces sizes and timeouts, rejects
# anything but the documented API, and opens a separate, well-formed request
# to the harness. The harness trusts X-Real-IP only from this proxy's network.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    default_type application/json;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # sizes
    client_max_body_size 1m;
    client_body_buffer_size 1m;           # bodies are buffered in memory, never on disk
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;     # request line or any header over 8k -> 400/414

    # timeouts: slow headers or bodies cannot hold connections
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    ignore_invalid_headers on;
    underscores_in_headers off;

    # per-address limits (the harness applies per-principal limits)
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream harness_api {
        server harness:8080;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        limit_conn conns 32;
        limit_req zone=per_client burst=100 nodelay;

        location = /v1/health {
            limit_except GET HEAD { deny all; }
            proxy_pass http://harness_api;
        }

        # The documented API only. Anything else never reaches the harness.
        location ~ "^/(v1/(actions|messages|delegations|approvals(/[A-Za-z0-9-]{1,64})?)|mcp)$" {
            limit_except GET POST { deny all; }

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host harness;
            proxy_set_header X-Real-IP $remote_addr;        # overwrites any client-supplied value
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_request_buffering on;                      # the harness only sees complete requests
            proxy_buffering on;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://harness_api;
        }

        location / {
            return 404 '{"error":"not found"}';
        }
    }
}
