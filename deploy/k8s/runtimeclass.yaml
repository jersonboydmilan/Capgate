# gVisor runtime. The agent pod selects this with `runtimeClassName: gvisor`, so
# the container that runs untrusted code runs under a user-space kernel instead
# of sharing the host kernel. The node must have runsc installed and the
# containerd runsc handler configured (see README.md).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
