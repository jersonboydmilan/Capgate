# Reference isolated runtime.
#
#   agent ──(agent_net, internal)──► harness ──(tool_net, internal)──► tools
#
# - agent_net and tool_net are `internal`: no route to the host or the internet.
# - The agent is attached to agent_net only (via netguard), so the tool service
#   is not routable from it; netguard's iptables allowlist further limits the
#   agent to tcp://harness:8700.
# - Secrets are mounted only into the containers that use them. The agent gets
#   one short-lived signed token (issued by the supervisor) and nothing else.
# - No ports are published to the host.

name: agent-harness-isolated

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  tmpfs: ["/tmp:size=16m,noexec,nosuid"]

networks:
  agent_net:
    internal: true
  tool_net:
    internal: true

secrets:
  tool_credential: {file: "${SECRETS_DIR:-./.secrets}/tool_credential"}
  signing_key: {file: "${SECRETS_DIR:-./.secrets}/signing_key"}
  token_keyring: {file: "${SECRETS_DIR:-./.secrets}/token_keyring"}

volumes:
  harness_data: {}
  tool_data: {}
  decoy_data: {}

services:
  tools:
    <<: *hardening
    build: {context: ../.., dockerfile: deploy/isolated/Dockerfile.harness, args: {BASE_IMAGE: "${BASE_IMAGE:-alpine:latest}"}}
    image: agent-harness:local
    command: ["python3", "-m", "harness.toolservice", "--host", "0.0.0.0", "--port", "9100",
              "--credential-file", "/run/secrets/tool_credential", "--ledger", "/data/ledger.jsonl"]
    networks: [tool_net]
    secrets: [tool_credential]
    volumes: ["tool_data:/data"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 2s
      retries: 30

  harness:
    <<: *hardening
    image: agent-harness:local
    depends_on:
      tools: {condition: service_healthy}
    command: ["python3", "-m", "harness.cli", "serve", "/config/server.yaml"]
    networks: [agent_net, tool_net]
    secrets: [tool_credential, signing_key, token_keyring]
    volumes:
      - "harness_data:/data"
      - "./config:/config:ro"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/v1/health', timeout=2)"]
      interval: 2s
      retries: 30

  # A deliberately misconfigured tool: attached to the agent's network, as if an
  # operator made a mistake. Topology alone would let the agent reach it; the
  # netguard allowlist must not. Proves the second layer does real work.
  misattached-tool:
    <<: *hardening
    image: agent-harness:local
    command: ["python3", "-m", "harness.toolservice", "--host", "0.0.0.0", "--port", "9100",
              "--credential-env", "DECOY_CREDENTIAL", "--ledger", "/data/ledger.jsonl"]
    environment:
      DECOY_CREDENTIAL: "decoy-credential-not-secret"
    networks: [agent_net]
    volumes: ["decoy_data:/data"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 2s
      retries: 30

  netguard:
    build: {context: ../.., dockerfile: deploy/isolated/Dockerfile.netguard, args: {BASE_IMAGE: "${BASE_IMAGE:-alpine:latest}"}}
    image: agent-harness-netguard:local
    depends_on:
      harness: {condition: service_healthy}
      misattached-tool: {condition: service_healthy}
    networks: [agent_net]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    read_only: true
    tmpfs: ["/tmp:size=1m"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/netguard-ready"]
      interval: 1s
      retries: 60

  agent:
    <<: *hardening
    build: {context: ../.., dockerfile: deploy/isolated/Dockerfile.agent, args: {BASE_IMAGE: "${BASE_IMAGE:-alpine:latest}"}}
    image: agent-harness-agent:local
    profiles: [attack]
    depends_on:
      netguard: {condition: service_healthy}
    network_mode: "service:netguard"
    environment:
      HARNESS_URL: "http://harness:8700"
