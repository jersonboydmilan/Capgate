# capgate token keygen --keyring examples/basic/keys.json
# capgate serve examples/basic/server.yaml
# capgate token issue --keyring examples/basic/keys.json --sub researcher --role agent --ttl 15m
contracts: [contract.yaml]
listen: {host: 127.0.0.1, port: 8700}
audit: audit.jsonl
state: state.db
identity:
  keyring_file: keys.json
  max_ttl_seconds: 3600
tools:
  web.search: {type: echo}
  notes.write: {type: echo}
rate_limit:                           # per process; defaults shown
  client_rate: 20                     # requests/second per client address (checked before token verification)
  client_burst: 100
  principal_rate: 10                  # requests/second per agent or approver
  principal_burst: 60
  auth_failure_audit_per_minute: 20   # further failures are counted, not recorded individually
