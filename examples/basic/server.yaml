# harness serve examples/basic/server.yaml
# Requires: RESEARCHER_TOKEN and ALICE_TOKEN (16+ chars) in the environment.
contracts: [contract.yaml]
listen: {host: 127.0.0.1, port: 8700}
audit: audit.jsonl
agents:
  researcher: {token_env: RESEARCHER_TOKEN}
approvers:
  alice: {token_env: ALICE_TOKEN}
tools:
  web.search: {type: echo}
  notes.write: {type: echo}
