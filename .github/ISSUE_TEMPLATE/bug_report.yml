name: Bug report
description: Something behaves incorrectly (not a security bypass — use the security advisory link for those).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a way an agent can act outside its contract, use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, ideally a minimal contract/task or a failing test in the style of tests/.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release.
  - type: dropdown
    id: transport
    attributes:
      label: HTTP transport (if relevant)
      options: ["n/a", "uvicorn", "stdlib", "both"]
