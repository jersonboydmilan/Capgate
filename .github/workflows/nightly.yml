name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  deep-fuzz:
    name: deep property-based fuzzing
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: deep
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Thousands of examples per property
        run: uv run --no-sync pytest -q tests/fuzz
