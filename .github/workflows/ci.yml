name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.transport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        transport: [stdlib, uvicorn]
    env:
      CAPGATE_HTTP_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Test suite (${{ matrix.transport }} transport)
        run: uv run --no-sync pytest -q

  isolation:
    name: docker isolation boundary
    # Heavy (builds images, drives containers with iptables). On demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Fetch offline build artifacts
        run: uv run --no-sync python deploy/fetch_artifacts.py
      - name: Attack the containerised deployment from inside the agent sandbox
        run: uv run --no-sync pytest -q -m docker tests/adversarial/isolation
