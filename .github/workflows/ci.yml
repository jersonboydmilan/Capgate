name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.transport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        transport: [stdlib, uvicorn]
    env:
      CAPGATE_HTTP_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Test suite (${{ matrix.transport }} transport)
        run: uv run --no-sync pytest -q

  k8s:
    name: k8s (manifest schema + isolation invariants)
    # Static validation: fast, no cluster. Renders the kustomize base, schema-checks
    # it, and asserts the agent-isolation invariants (deploy/k8s/validate.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install kubeconform
        run: |
          set -euo pipefail
          ver=0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${ver}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Create the environment (PyYAML for the invariant checker)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Render manifests
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s > /tmp/capgate-k8s.yaml
      - name: Schema validation (kubeconform)
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/capgate-k8s.yaml
      - name: Isolation invariants
        run: uv run --no-sync python deploy/k8s/validate.py /tmp/capgate-k8s.yaml

  k8s-e2e:
    name: "k8s-e2e (live cluster: kind + Calico NetworkPolicy)"
    # Heavy: spins up kind with Calico (a CNI that enforces NetworkPolicy egress),
    # deploys the stack, runs the real compromised-agent Job, and asserts the
    # cluster controls hold live. On demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CALICO_VERSION: v3.28.2
      KIND_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          kind version
      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Create kind cluster (default CNI disabled)
        run: kind create cluster --config deploy/k8s-e2e/kind.yaml --wait 120s
      - name: Install Calico and wait for it
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Build images and load them into kind
        run: |
          set -euo pipefail
          uv run --no-sync python deploy/fetch_artifacts.py
          docker build -t capgate-harness:local -f deploy/harness/Dockerfile --build-arg BASE_IMAGE=alpine:latest .
          docker build -t capgate-proxy:local  -f deploy/proxy/Dockerfile   --build-arg BASE_IMAGE=alpine:latest .
          docker build -t capgate-agent:local  -f deploy/agent/Dockerfile   --build-arg BASE_IMAGE=alpine:latest .
          kind load docker-image capgate-harness:local capgate-proxy:local capgate-agent:local
      - name: Deploy the stack (agent Job starts suspended)
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s-e2e | kubectl apply -f -
      - name: Bootstrap secrets and the agent token
        run: sh deploy/k8s/bootstrap.sh capgate
      - name: Wait for harness, tools and proxy
        run: |
          set -euo pipefail
          kubectl -n capgate rollout status deploy/tools   --timeout=180s
          kubectl -n capgate rollout status deploy/harness --timeout=180s
          kubectl -n capgate rollout status deploy/proxy   --timeout=180s
      - name: Run the compromised agent
        run: |
          set -euo pipefail
          kubectl -n capgate patch job/agent --type=merge -p '{"spec":{"suspend":false}}'
          kubectl -n capgate wait --for=condition=complete job/agent --timeout=300s \
            || { kubectl -n capgate wait --for=condition=failed job/agent --timeout=5s && echo "agent Job failed" && exit 1; }
      - name: Collect ground truth and assert
        run: |
          set -euo pipefail
          kubectl -n capgate logs job/agent | grep -E '^\{' | tail -1 > /tmp/obs.json
          kubectl -n capgate exec deploy/tools   -- cat /data/ledger.jsonl > /tmp/ledger.jsonl || true
          kubectl -n capgate exec deploy/harness -- python3 -m capgate.cli audit /data/audit.jsonl --json > /tmp/audit.json
          uv run --no-sync python deploy/k8s-e2e/assert.py /tmp/obs.json /tmp/ledger.jsonl /tmp/audit.json
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n capgate get pods -o wide || true
          kubectl -n capgate get networkpolicies || true
          kubectl -n capgate describe pods || true
          kubectl -n capgate logs job/agent --tail=200 || true
          kubectl -n capgate logs deploy/harness --tail=100 || true
          kubectl -n capgate logs deploy/proxy --tail=50 || true
      - name: Tear down
        if: always()
        run: kind delete cluster || true

  docker:
    name: docker (isolation, mTLS edge, multi-host state)
    # Heavy (builds images, drives containers with iptables). On demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Fetch offline build artifacts
        run: uv run --no-sync python deploy/fetch_artifacts.py
      - name: Containerised isolation, mTLS edge and multi-host state
        run: uv run --no-sync pytest -q -m "docker and not gvisor"

  gvisor:
    name: gvisor (isolation under a user-space kernel)
    # Installs gVisor and re-runs the isolation attack with the agent under runsc.
    # Heavy; on demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install gVisor (runsc) and register it with Docker
        run: |
          set -euo pipefail
          # Official GPG-signed APT repository (https://gvisor.dev/docs/user_guide/install/).
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          # Host-network passthrough: gVisor keeps its syscall/kernel sandbox (the Sentry
          # still intercepts syscalls) while networking uses the container's real netns
          # stack -- so netguard's iptables egress allowlist and Docker's embedded DNS both
          # apply exactly as on runc. Network isolation stays with netguard; gVisor adds
          # kernel isolation. See deploy/gvisor/README.md.
          sudo runsc install -- --network=host
          sudo systemctl reload docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Fetch offline build artifacts
        run: uv run --no-sync python deploy/fetch_artifacts.py
      - name: Isolation attack with the agent under gVisor
        run: uv run --no-sync pytest -q -m gvisor
