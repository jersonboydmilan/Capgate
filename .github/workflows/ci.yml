name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.transport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        transport: [stdlib, uvicorn]
    env:
      CAPGATE_HTTP_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Test suite (${{ matrix.transport }} transport)
        run: uv run --no-sync pytest -q

  k8s:
    name: k8s (manifest schema + isolation invariants)
    # Static validation: fast, no cluster. Renders the kustomize base, schema-checks
    # it, and asserts the agent-isolation invariants (deploy/k8s/validate.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install kubeconform
        run: |
          set -euo pipefail
          ver=0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${ver}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Create the environment (PyYAML for the invariant checker)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Render manifests
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s > /tmp/capgate-k8s.yaml
      - name: Schema validation (kubeconform)
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/capgate-k8s.yaml
      - name: Isolation invariants
        run: uv run --no-sync python deploy/k8s/validate.py /tmp/capgate-k8s.yaml

  docker:
    name: docker (isolation, mTLS edge, multi-host state)
    # Heavy (builds images, drives containers with iptables). On demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Fetch offline build artifacts
        run: uv run --no-sync python deploy/fetch_artifacts.py
      - name: Containerised isolation, mTLS edge and multi-host state
        run: uv run --no-sync pytest -q -m "docker and not gvisor"

  gvisor:
    name: gvisor (isolation under a user-space kernel)
    # Installs gVisor and re-runs the isolation attack with the agent under runsc.
    # Heavy; on demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install gVisor (runsc) and register it with Docker
        run: |
          set -euo pipefail
          # Official GPG-signed APT repository (https://gvisor.dev/docs/user_guide/install/).
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          # Host-network passthrough: gVisor keeps its syscall/kernel sandbox (the Sentry
          # still intercepts syscalls) while networking uses the container's real netns
          # stack -- so netguard's iptables egress allowlist and Docker's embedded DNS both
          # apply exactly as on runc. Network isolation stays with netguard; gVisor adds
          # kernel isolation. See deploy/gvisor/README.md.
          sudo runsc install -- --network=host
          sudo systemctl reload docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Fetch offline build artifacts
        run: uv run --no-sync python deploy/fetch_artifacts.py
      - name: Isolation attack with the agent under gVisor
        run: uv run --no-sync pytest -q -m gvisor
